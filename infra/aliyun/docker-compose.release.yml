name: aliyun

services:
  tpqr-migrate:
    image: tpqr-cn-api:${TPQR_RELEASE:?TPQR_RELEASE must be set}
    env_file:
      - ${TPQR_RUNTIME_ENV_FILE:-/opt/tpqr/.env}
    command: ["npm", "run", "db:migrate:remote"]
    volumes:
      - /opt/tpqr/data:/data/tpqr

  api:
    image: tpqr-cn-api:${TPQR_RELEASE:?TPQR_RELEASE must be set}
    env_file:
      - ${TPQR_RUNTIME_ENV_FILE:-/opt/tpqr/.env}
    environment:
      HOST: "0.0.0.0"
    depends_on:
      tpqr-migrate:
        condition: service_completed_successfully
    expose:
      - "8787"
    volumes:
      - /opt/tpqr/data:/data/tpqr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  tpqr-gateway:
    image: tpqr-cn-gateway:${TPQR_RELEASE:?TPQR_RELEASE must be set}
    environment:
      TPQR_DOMAIN: ${TPQR_DOMAIN:?TPQR_DOMAIN must be set}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
    external: true
    name: aliyun_caddy-data
  caddy-config:
    external: true
    name: aliyun_caddy-config
