name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && 'issue-link-only' || 'checks' }}
  cancel-in-progress: true

jobs:
  issue-link:
    name: issue-link
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify the pull request links one repository issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/issue-link.mjs

  verify:
    name: verify
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  aliyun-integration:
    name: aliyun-integration
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run test:integration

  security:
    name: security
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:security

  browser-desktop:
    name: browser-desktop
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run setup:local
      - run: npm run test:fixtures
      - run: npx playwright test --project=chromium

  browser-mobile:
    name: browser-mobile
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run setup:local
      - run: npm run test:fixtures
      - run: npx playwright test --project=mobile

  docker-smoke:
    name: docker-smoke
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f infra/aliyun/docker-compose.yml -f infra/aliyun/docker-compose.local.yml config
      - name: Start local compose smoke stack
        run: |
          trap 'docker compose -f infra/aliyun/docker-compose.yml -f infra/aliyun/docker-compose.local.yml down -v' EXIT
          docker compose -f infra/aliyun/docker-compose.yml -f infra/aliyun/docker-compose.local.yml up -d --build
          if ! curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/health; then
            docker compose -f infra/aliyun/docker-compose.yml -f infra/aliyun/docker-compose.local.yml ps
            docker compose -f infra/aliyun/docker-compose.yml -f infra/aliyun/docker-compose.local.yml logs --no-color
            exit 1
          fi

  opensource-boundary:
    name: opensource-boundary
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check:opensource
      - name: Check changed lines for whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BEFORE_SHA...$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^...$HEAD_SHA"
          fi
