name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  aliyun-integration:
    name: aliyun-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run test:integration

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:security

  browser-desktop:
    name: browser-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run setup:local
      - run: npm run test:fixtures
      - run: npx playwright test --project=chromium

  browser-mobile:
    name: browser-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run setup:local
      - run: npm run test:fixtures
      - run: npx playwright test --project=mobile

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f infra/aliyun/docker-compose.yml -f infra/aliyun/docker-compose.local.yml config
      - run: docker build -f infra/aliyun/Dockerfile -t tpqr-cn-ci .
      - name: Start local compose smoke stack
        run: |
          trap 'docker compose -f infra/aliyun/docker-compose.yml -f infra/aliyun/docker-compose.local.yml down -v' EXIT
          docker compose -f infra/aliyun/docker-compose.yml -f infra/aliyun/docker-compose.local.yml up -d --build
          if ! curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/health; then
            docker compose -f infra/aliyun/docker-compose.yml -f infra/aliyun/docker-compose.local.yml ps
            docker compose -f infra/aliyun/docker-compose.yml -f infra/aliyun/docker-compose.local.yml logs --no-color
            exit 1
          fi

  opensource-boundary:
    name: opensource-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:opensource
      - run: git diff --check
